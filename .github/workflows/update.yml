name: Update results

on:
  schedule:
    # 大会期間（10/5〜10/12 UTC）は5分おき。GitHubの混雑で数分遅れることがあります
    - cron: "*/5 * 5-12 10 *"
    # それ以外は1日4回（出場者リストの変更を拾う）
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official data (loops during the event)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub の定期実行は混雑時に数時間おきまで間引かれるため、
          # 大会期間中は1回の実行の中で3分おきに公式を確認し続ける（最長 5時間45分）。
          git config user.name "wusv-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today=$(date -u +%Y%m%d)
          if [ "$today" -ge 20261005 ] && [ "$today" -le 20261012 ]; then limit=$((345*60)); else limit=0; fi
          start=$(date +%s); fails=0
          while :; do
            if python3 scripts/update.py; then
              fails=0
              if ! git diff --quiet -- data.json; then
                git add data.json
                git commit -qm "data: $(date -u +'%Y-%m-%d %H:%M') UTC"
                git pull -q --rebase -X theirs origin main || true
                git push -q && echo "pushed $(date -u +%H:%M)"
              fi
            else
              fails=$((fails+1)); git checkout -- data.json 2>/dev/null || true
              echo "update failed ($fails in a row)"
              # 3回続けて失敗 → 実行を失敗で終える（GitHubから通知メール）
              if [ "$fails" -ge 3 ]; then exit 1; fi
            fi
            [ $(( $(date +%s) - start )) -ge "$limit" ] && break
            sleep 180
          done
